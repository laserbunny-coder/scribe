name: Build the phone app

on:
  push:
    branches: [main]
    paths-ignore: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths-ignore: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Scribe for Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle :app:assembleRelease --no-daemon
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk scribe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scribe-apk
          path: scribe.apk
      # Only builds of main become the version the phone downloads.
      - name: Publish for the phone
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Scribe build ${{ github.run_number }}
          make_latest: true
          files: scribe.apk
