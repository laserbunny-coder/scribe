<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scribe</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent; overflow: hidden; user-select: none; }
  /* Everything sits at the bottom middle; the window is sized to fit it. */
  #root { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; }
  .card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .45); max-width: 544px;
  }
  .pill { display: flex; align-items: center; gap: 12px; border-radius: 999px; padding: 8px 10px 8px 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .time { font-variant-numeric: tabular-nums; min-width: 42px; }
  canvas { width: 96px; height: 24px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--dim); text-align: center; }
  .spin { width: 16px; height: 16px; border: 2px solid #3a3a42; border-top-color: var(--accent); border-radius: 50%; animation: turn .8s linear infinite; }
  @keyframes turn { to { transform: rotate(1turn); } }
  .says { max-height: 4.4em; overflow: hidden; color: var(--dim); font-size: 13px; margin-top: 6px; }
  .x { margin-left: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="pill.js"></script>
</body>
</html>
